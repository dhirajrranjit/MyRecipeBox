<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Recipe Box</title>
<style>
:root{
  --bg:#f7f4ee;--panel:#fffdf9;--ink:#27231f;--muted:#746d63;--line:#e5ddd2;
  --nav:#2e2923;--nav2:#403931;--accent:#9a5b2e;--accent-soft:#f1dfcf;
  --danger:#a63a3a;--success:#3d7a52;--shadow:0 10px 30px rgba(55,42,28,.09);
  --radius:18px;--sidebar:248px
}
*{box-sizing:border-box}
html{overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);overflow-x:hidden}
button,input,textarea,select{font:inherit}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input,textarea,select{font-size:16px}
img{max-width:100%;display:block}
.hidden{display:none!important}
button{cursor:pointer}.app{min-height:100vh}
.sidebar{background:var(--nav);color:#fff;padding:18px 14px;position:fixed;left:0;top:0;bottom:0;width:var(--sidebar);height:100vh;overflow:auto;z-index:40}
.main{margin-left:var(--sidebar);min-width:0;min-height:100vh;width:calc(100% - var(--sidebar))}
.brand{display:flex;align-items:center;gap:10px;font-weight:850;font-size:1.2rem;padding:8px 8px 18px}
.brand-icon{width:36px;height:36px;border-radius:12px;background:#fff2;display:grid;place-items:center}
.nav{display:flex;flex-direction:column;gap:5px}.nav button{border:0;background:transparent;color:#e9e3dc;text-align:left;padding:10px 12px;border-radius:10px;font-weight:650}
.nav button:hover,.nav button.active{background:var(--nav2);color:#fff}.nav .divider{height:1px;background:#ffffff1b;margin:8px 5px}
.nav .small{font-size:.78rem;color:#bdb4aa;padding:6px 12px 2px;text-transform:uppercase;letter-spacing:.06em}
.sidebar-footer{margin-top:18px;color:#bdb4aa;font-size:.78rem;line-height:1.45;padding:0 8px}
.topbar{position:sticky;top:0;z-index:30;width:100%;background:rgba(247,244,238,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:14px 22px}
.mobile-menu{display:none}.search-wrap{flex:1;max-width:650px;position:relative}.search-wrap input{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px 11px 38px;outline:none}
.search-wrap span{position:absolute;left:13px;top:10px;color:var(--muted)}.top-actions{display:flex;gap:8px}
.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:750}.btn-primary{background:var(--accent);color:#fff}.btn-soft{background:var(--accent-soft);color:#6a3b1e}.btn-ghost{background:#eee7dc;color:#4b433a}.btn-danger{background:#f6dddd;color:var(--danger)}.btn-success{background:#e4f2e8;color:#2f6d44}
.content{max-width:1260px;margin:0 auto;padding:24px 28px 40px}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}.page-head h1{margin:0;font-size:1.85rem}.page-head p{margin:6px 0 0;color:var(--muted)}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px}.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.recipe-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.recipe-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);transition:.15s ease;cursor:pointer;position:relative}.recipe-card:hover{transform:translateY(-2px)}
.card-photo{aspect-ratio:16/10;background:linear-gradient(135deg,#ead9c5,#d8c0a6);display:grid;place-items:center;font-size:3rem;overflow:hidden}.card-photo img{width:100%;height:100%;object-fit:cover}.card-body{padding:15px}.card-title-row{display:flex;gap:8px;align-items:flex-start}.card-title{font-weight:850;line-height:1.25;flex:1}.fav-btn{border:0;background:transparent;font-size:1.2rem;padding:0}.card-meta{color:var(--muted);font-size:.87rem;margin-top:6px}.card-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}.mini-tag{font-size:.73rem;padding:4px 7px;background:#eee4d9;border-radius:999px;color:#6c4b31}
.empty{padding:70px 15px;text-align:center;color:var(--muted)}.empty .emoji{font-size:3rem;margin-bottom:10px}
.detail{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,.8fr);gap:24px}.hero{background:var(--panel);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}.hero-photo{aspect-ratio:16/8;background:linear-gradient(135deg,#ead9c5,#d8c0a6);display:grid;place-items:center;font-size:4rem;overflow:hidden}.hero-photo img{width:100%;height:100%;object-fit:cover}.hero-body{padding:22px}.hero h1{font-size:2rem;margin:0 0 8px}.muted{color:var(--muted)}.meta-grid{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:18px 0}.meta-cell{padding:11px;border-right:1px solid var(--line);text-align:center}.meta-cell:last-child{border-right:0}.meta-cell small{display:block;color:var(--muted);font-size:.72rem}.meta-cell strong{display:block;margin-top:2px}
.servings-control{display:flex;justify-content:center;align-items:center;gap:8px}.round{width:27px;height:27px;border-radius:50%;border:1px solid var(--line);background:#fff}
.action-row{display:flex;gap:8px;flex-wrap:wrap}.section-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:18px}.section-card h2{margin:0 0 14px;font-size:1.2rem}
.ingredients{list-style:none;padding:0;margin:0}.ingredient{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}.ingredient:last-child{border-bottom:0}.ingredient input{margin-top:4px}.ingredient.checked span{text-decoration:line-through;color:var(--muted)}
.steps{margin:0;padding-left:26px}.steps li{padding:0 0 13px 6px;line-height:1.55}.note{background:#fff3d8;border-left:4px solid #d89a2d;padding:12px 14px;border-radius:8px;white-space:pre-wrap}
.side-panel{align-self:start;position:sticky;top:82px}.side-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}.side-card h3{margin:0 0 10px;font-size:1rem}.source-link{word-break:break-word}
.form-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}
.photo-editor{display:grid;grid-template-columns:220px 1fr;gap:16px;align-items:start}
.photo-preview{
  aspect-ratio:16/10;border:1px dashed #cfc3b5;border-radius:14px;background:#f3eee7;
  display:grid;place-items:center;overflow:hidden;color:var(--muted);min-height:138px
}
.photo-preview img{width:100%;height:100%;object-fit:cover}
.photo-empty{text-align:center;padding:16px;font-size:.88rem}
.photo-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.photo-actions .btn{min-height:42px}
.photo-help{font-size:.78rem;color:var(--muted);line-height:1.45;margin-top:8px}
.photo-status{font-size:.8rem;margin-top:8px;color:var(--muted)}
.camera-only{display:none}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.full{grid-column:1/-1}.form-grid label,.modal label{display:block;font-size:.84rem;font-weight:800;margin-bottom:6px}.form-grid input,.form-grid textarea,.form-grid select,.modal input,.modal textarea,.modal select{width:100%;border:1px solid #d8cfc3;border-radius:10px;padding:10px 11px;background:#fff}.form-grid textarea,.modal textarea{min-height:120px;resize:vertical}.form-section{grid-column:1/-1;border-top:1px solid var(--line);padding-top:16px;margin-top:4px}.form-section h3{margin:0 0 12px}
.inline-list{display:flex;flex-direction:column;gap:8px}.inline-row{display:grid;grid-template-columns:110px 120px 1fr auto;gap:8px}.inline-row.step{grid-template-columns:42px 1fr auto}.inline-row input{min-width:0}.icon-btn{border:0;background:#f0ebe4;border-radius:9px;padding:8px 10px}.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px;flex-wrap:wrap}
.modal-backdrop{position:fixed;inset:0;background:#0007;z-index:100;display:grid;place-items:center;padding:18px}.modal{background:var(--panel);width:min(760px,100%);max-height:90vh;overflow:auto;border-radius:20px;box-shadow:0 24px 70px #0004;padding:22px}.modal h2{margin:0 0 6px}.modal-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.choice-grid.two{grid-template-columns:repeat(2,1fr)}.choice{border:1px solid var(--line);background:#fff;border-radius:14px;padding:16px;text-align:left}.choice strong{display:block;margin-bottom:4px}.choice small{color:var(--muted)}
.import-preview{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}.status{padding:10px 12px;border-radius:10px;background:#eee7dc;margin-top:10px}.status.error{background:#f7dddd;color:#7d2525}.status.ok{background:#e4f2e8;color:#2f6d44}
.grocery-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}.grocery-item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:flex-start}.grocery-item label{font-weight:600;margin:0}
.collection-pill{display:inline-flex;gap:4px;align-items:center;background:#eee4d9;border-radius:999px;padding:5px 9px;margin:3px;font-size:.78rem}
.toast{position:fixed;right:18px;bottom:18px;background:#28231f;color:#fff;padding:12px 15px;border-radius:12px;box-shadow:var(--shadow);z-index:140;max-width:340px}
.cook{position:fixed;inset:0;background:#fbf8f3;z-index:120;display:flex;flex-direction:column}.cook-top{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.cook-main{flex:1;display:grid;place-items:center;padding:28px;overflow:auto}.cook-step{max-width:850px;font-size:clamp(1.4rem,3vw,2.15rem);line-height:1.5;text-align:center}.cook-foot{padding:14px 18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}.cook-progress{color:var(--muted)}

@media(max-width:1100px) and (min-width:761px){
  :root{--sidebar:220px}
  .content{padding:20px}
  .topbar{padding:12px 18px}
}
@media(max-width:980px){.recipe-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.detail{grid-template-columns:1fr}.side-panel{position:static}.choice-grid{grid-template-columns:1fr}}
@media(max-width:760px){
  :root{--mobile-pad:14px}
  .app{min-height:100dvh}
  .main{margin-left:0;width:100%;min-height:100dvh}
  .sidebar{
    position:fixed;left:0;top:0;bottom:0;width:min(84vw,300px);height:100dvh;
    transform:translateX(-105%);transition:transform .2s ease;padding-top:max(18px,env(safe-area-inset-top));
    padding-bottom:max(18px,env(safe-area-inset-bottom));box-shadow:0 0 40px rgba(0,0,0,.28)
  }
  .sidebar.open{transform:translateX(0)}
  .sidebar-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:35;display:none}
  .sidebar-backdrop.show{display:block}

  .topbar{
    padding:max(10px,env(safe-area-inset-top)) var(--mobile-pad) 10px;
    gap:8px;align-items:center
  }
  .mobile-menu{display:inline-flex;min-width:44px;min-height:44px;align-items:center;justify-content:center;padding:8px}
  .search-wrap{min-width:0}
  .search-wrap input{padding:11px 12px 11px 36px;min-height:44px}
  .top-actions{display:none}

  .content{padding:14px var(--mobile-pad) calc(22px + env(safe-area-inset-bottom));width:100%;overflow-x:hidden}
  .page-head{align-items:flex-start;flex-direction:column;margin-bottom:16px}
  .page-head h1{font-size:1.55rem}
  .page-head .btn{width:100%;min-height:46px}

  .filter-row{overflow-x:auto;flex-wrap:nowrap;margin:0 calc(-1 * var(--mobile-pad)) 16px;padding:0 var(--mobile-pad) 4px;scrollbar-width:none}
  .filter-row::-webkit-scrollbar{display:none}
  .chip{white-space:nowrap;min-height:40px}

  .recipe-grid{grid-template-columns:1fr;gap:14px}
  .recipe-card{border-radius:16px}
  .card-photo{aspect-ratio:16/9}
  .card-body{padding:14px}
  .fav-btn{min-width:42px;min-height:42px;display:inline-grid;place-items:center;margin:-8px -8px 0 0}

  .detail{grid-template-columns:1fr;gap:14px}
  .hero{border-radius:18px}
  .hero-photo{aspect-ratio:16/9}
  .hero-body{padding:16px}
  .hero h1{font-size:1.55rem;line-height:1.2}
  .meta-grid{grid-template-columns:repeat(2,minmax(0,1fr));margin:14px 0}
  .meta-cell{min-width:0;padding:10px 7px}
  .meta-cell:nth-child(2){border-right:0}
  .meta-cell:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .meta-cell strong{font-size:1rem;overflow-wrap:anywhere}
  .servings-control{gap:6px}
  .round{width:36px;height:36px;min-width:36px}
  #portionInput{width:62px!important;min-height:38px}

  .action-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .action-row .btn{width:100%;min-height:46px;padding:10px 8px;white-space:normal}
  .action-row .btn-primary,.action-row .btn-success{grid-column:1/-1}

  .section-card{padding:16px;border-radius:16px;margin-top:14px}
  .section-card h2{font-size:1.15rem}
  .ingredient{gap:11px;padding:11px 0;line-height:1.45}
  .ingredient input[type="checkbox"]{width:20px;height:20px;min-width:20px}
  .steps{padding-left:24px}
  .steps li{padding-bottom:15px}
  .side-panel{position:static}
  .side-card{padding:16px}

  .form-card{padding:16px;border-radius:16px}
  .photo-editor{grid-template-columns:1fr}
  .photo-preview{aspect-ratio:16/9;min-height:0}
  .photo-actions{display:grid;grid-template-columns:1fr 1fr}
  .photo-actions .btn{width:100%}
  .camera-only{display:inline-flex}

  .form-grid{grid-template-columns:1fr;gap:12px}
  .full,.form-section{grid-column:1}
  .form-grid input,.form-grid textarea,.form-grid select{min-height:44px;scroll-margin-top:78px}
  .form-grid textarea{min-height:120px}
  .inline-list{gap:10px}
  .inline-row{
    grid-template-columns:70px 82px minmax(0,1fr) 42px;
    gap:6px;align-items:start
  }
  .inline-row.step{grid-template-columns:34px minmax(0,1fr) 42px}
  .inline-row input{width:100%;min-height:44px}
  .icon-btn{min-width:42px;min-height:42px}
  .form-actions{position:sticky;bottom:0;background:linear-gradient(to top,var(--panel) 75%,rgba(255,253,249,0));padding-top:14px;padding-bottom:max(6px,env(safe-area-inset-bottom));z-index:5}
  .form-actions .btn{flex:1;min-height:46px}

  .modal-backdrop{
    align-items:end;padding:0;background:rgba(0,0,0,.5)
  }
  .modal{
    width:100%;max-height:92dvh;border-radius:20px 20px 0 0;
    padding:18px var(--mobile-pad) calc(18px + env(safe-area-inset-bottom))
  }
  .modal input,.modal textarea,.modal select{min-height:44px}
  .choice-grid{grid-template-columns:1fr}
  .modal-actions{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom));background:var(--panel);padding:12px 0 calc(12px + env(safe-area-inset-bottom));z-index:4}
  .modal-actions .btn{flex:1;min-height:46px}

  .grocery-item{padding:11px 0}
  .grocery-item input[type="checkbox"]{width:20px;height:20px;min-width:20px;margin-top:2px}

  .toast{
    left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:none;text-align:center
  }

  .cook{min-height:100dvh}
  .cook-top{padding:max(12px,env(safe-area-inset-top)) 14px 12px;gap:10px}
  .cook-top strong{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cook-main{padding:22px 16px}
  .cook-step{font-size:clamp(1.3rem,6vw,1.9rem);line-height:1.45}
  .cook-foot{padding:12px 14px calc(12px + env(safe-area-inset-bottom))}
  .cook-foot .btn{min-height:48px;min-width:110px}

  .empty{padding:46px 12px}
}

@media(max-width:390px){
  .action-row{grid-template-columns:1fr}
  .action-row .btn-primary,.action-row .btn-success{grid-column:auto}
  .inline-row{grid-template-columns:58px 70px minmax(0,1fr) 40px}
  .meta-cell{padding:9px 5px}
  .hero-body{padding:14px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brand-icon">🍳</div><div>My Recipe Box</div></div>
    <div class="nav">
      <button data-page="recipes" class="active">🍽️ &nbsp;Recipes</button>
      <button data-page="favorites">♥️ &nbsp;Favorites</button>
      <button data-page="collections">📚 &nbsp;Collections</button>
      <button data-page="recent">🕘 &nbsp;Recently Added</button>
      <div class="divider"></div>
      <button id="navAdd">＋ &nbsp;New Recipe</button>
      <div class="divider"></div>
      <div class="small">Data</div>
      <button data-page="data">💾 &nbsp;Backup & Data</button>
    </div>
    <div class="sidebar-footer">Stored in this browser using IndexedDB.<br>Designed for free static hosting such as GitHub Pages.</div>
  </aside>
  <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="openSidebar(false)"></div>

  <main class="main">
    <div class="topbar">
      <button class="btn btn-ghost mobile-menu" id="menuBtn">☰</button>
      <div class="search-wrap"><span>⌕</span><input id="globalSearch" type="search" placeholder="Search recipes, ingredients, tags..."></div>
      <div class="top-actions">
        <button class="btn btn-primary" id="addBtn">+ Add Recipe</button>
      </div>
    </div>
    <div class="content" id="content"><div class="empty" id="startupState"><div class="emoji">🍳</div><h3>Loading Recipe Box…</h3></div></div>
  </main>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<script>
const starterRecipe = {
  id: "builtin_mcdonalds_style_air_fryer_nuggets",
  title: "McDonald's-Style Crispy Air Fryer Chicken Nuggets",
  category: "Chicken",
  time: "About 20 minutes",
  servings: 4,
  tags: ["air fryer","chicken","nuggets","kids","crispy"],
  ingredients: [
    "1 lb boneless, skinless chicken breast",
    "1 tsp salt",
    "1/2 tsp garlic powder",
    "1/2 tsp onion powder",
    "1/4 tsp white pepper",
    "2 tbsp cornstarch for the chicken mixture",
    "1/2 cup all-purpose flour",
    "1/2 cup cornstarch for coating",
    "1 tsp salt for coating",
    "1/2 tsp garlic powder for coating",
    "1/2 tsp onion powder for coating",
    "1/4 tsp white pepper for coating",
    "1/2 tsp paprika",
    "1 large egg",
    "1/2 cup cold water",
    "Olive oil spray or avocado oil spray"
  ],
  instructions: [
    "Cut the chicken into chunks and blend with salt, garlic powder, onion powder, white pepper, and 2 tablespoons cornstarch until fairly smooth.",
    "Wet or lightly oil your hands and shape the chicken into small, thin nugget shapes.",
    "Preheat the air fryer to 375°F for about 3 minutes.",
    "In one bowl, mix flour, cornstarch, salt, garlic powder, onion powder, white pepper, and paprika.",
    "In another bowl, whisk the egg and cold water together.",
    "Add the egg-and-water mixture to the dry ingredients and whisk until you have a smooth, fairly thin batter.",
    "Lightly dust each nugget with a little flour or cornstarch first. This helps the wet batter stick, especially when you are not freezing the nuggets.",
    "Dip each nugget into the wet batter and let the excess drip off.",
    "Lightly spray the air fryer basket with oil. If using parchment, use perforated air-fryer parchment so air can circulate.",
    "Place the nuggets in a single layer with a little space between each one. Do not overcrowd the basket.",
    "Lightly spray the tops of the nuggets with olive oil or avocado oil spray. Make sure any obvious dry batter spots get a little oil.",
    "Air fry at 375°F for 6 minutes.",
    "Carefully flip the nuggets. Lightly spray any dry-looking spots on the second side.",
    "Continue air frying at 375°F for another 3–4 minutes.",
    "For extra crispiness, increase the air fryer to 400°F for the final 1–2 minutes.",
    "Remove the nuggets as soon as the centers reach 165°F so they stay juicy.",
    "Let them rest on a wire rack for 1–2 minutes so the bottoms stay crisp instead of steaming."
  ],
  notes: "These nuggets are designed for the air fryer and do not need to be frozen first. Keep them small and fairly thin so the coating crisps before the inside dries out. Cornstarch helps create a lighter, crispier coating. A light oil spray is important, but too much oil can make the batter heavy or soggy. Cook in batches if necessary rather than crowding the basket."
};


const macCheeseRecipe = {
  id: "builtin_mac_cheese_2_servings",
  title: "Creamy Mac & Cheese — 2 Servings",
  category: "Pasta",
  time: "About 20 minutes",
  servings: 2,
  tags: ["mac and cheese","pasta","cheddar","quick"],
  ingredients: [
    "1 cup dry elbow macaroni",
    "1 tbsp butter",
    "1 tbsp all-purpose flour",
    "3/4 cup milk",
    "1/2 cup shredded cheddar cheese",
    "1/2 cup shredded mixed cheese",
    "1/4 tsp salt, or to taste",
    "A small pinch of black pepper",
    "Optional: pinch of garlic powder or paprika"
  ],
  instructions: [
    "Cook the macaroni in salted water until just tender. Drain and set aside.",
    "In the same pot, melt the butter over low to medium heat.",
    "Add the flour and stir continuously for about 30–60 seconds. Do not let it brown.",
    "Slowly pour in the milk while whisking or stirring so the sauce stays smooth.",
    "Cook for 2–3 minutes, stirring, until the milk mixture thickens slightly.",

function uid(prefix="id"){return `${prefix}_${Date.now()}_${Math.random().toString(36).slice(2,9)}`}

function openDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME,DB_VERSION);
    req.onupgradeneeded=()=>{
      const d=req.result;
      if(!d.objectStoreNames.contains("recipes")) d.createObjectStore("recipes",{keyPath:"id"});
      if(!d.objectStoreNames.contains("collections")) d.createObjectStore("collections",{keyPath:"id"});
      if(!d.objectStoreNames.contains("meta")) d.createObjectStore("meta",{keyPath:"key"});
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
function tx(store,mode="readonly"){return db.transaction(store,mode).objectStore(store)}
function idbAll(store){return new Promise((res,rej)=>{const r=tx(store).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
function idbGet(store,key){return new Promise((res,rej)=>{const r=tx(store).get(key);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error)})}
function idbPut(store,val){return new Promise((res,rej)=>{const r=tx(store,"readwrite").put(val);r.onsuccess=()=>res(val);r.onerror=()=>rej(r.error)})}
function idbDelete(store,key){return new Promise((res,rej)=>{const r=tx(store,"readwrite").delete(key);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function idbClear(store){return new Promise((res,rej)=>{const r=tx(store,"readwrite").clear();r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}

function normalizeLegacy(r,origin="user"){
  const title=(r.title||"Untitled Recipe").replace(/\s+[—-]\s*\d+\s*Servings?$/i,"");
  const m=(r.title||"").match(/\s+[—-]\s*(\d+)\s*Servings?$/i);
  const now=new Date().toISOString();
  return {
    id:r.id||uid("recipe"), title, description:r.description||"", category:r.category||"",
    cuisine:r.cuisine||inferCuisine(r), cookingMethods:r.cookingMethods||inferMethods(r),
    tags:Array.isArray(r.tags)?r.tags:[], collections:Array.isArray(r.collections)?r.collections:[],
    servings:Number(r.servings||m?.[1]||3)||3, yieldText:r.yieldText||"",
    prepTime:r.prepTime||"", cookTime:r.cookTime||r.time||"", restTime:r.restTime||"", totalTime:r.totalTime||r.time||"",
    ingredients:(r.ingredients||[]).map((x,i)=>typeof x==="string"?parseIngredient(x,i):({...x,id:x.id||uid("ing")})),
    instructions:(r.instructions||[]).map((x,i)=>typeof x==="string"?{id:uid("step"),text:x,section:"",timerMinutes:detectTimer(x)}:{...x,id:x.id||uid("step")}),
    notes:r.notes||"", photo:r.photo||"", photoCredit:r.photoCredit||"", photoSource:r.photoSource||"", sourceType:r.sourceType||origin, sourceUrl:r.sourceUrl||"",
    sourceSite:r.sourceSite||"", author:r.author||"", favorite:!!r.favorite, rating:r.rating||0,
    createdAt:r.createdAt||now, updatedAt:r.updatedAt||now, lastCooked:r.lastCooked||null, timesCooked:r.timesCooked||0,
    origin:r.origin||origin, userModified:!!r.userModified
  };
}
function inferCuisine(r){
  const s=[r.category,...(r.tags||[])].join(" ").toLowerCase();
  if(s.includes("indian")) return "Indian"; if(s.includes("middle eastern")||s.includes("shawarma")) return "Middle Eastern"; return "";
}
function inferMethods(r){
  const s=[r.title,r.notes,...(r.tags||[]),...(r.instructions||[])].join(" ").toLowerCase(), a=[];
  if(s.includes("air fry")) a.push("Air Fryer"); if(s.includes("skillet")||s.includes("pan sear")) a.push("Pan"); if(s.includes("oven")||s.includes("bake")) a.push("Oven");
  return a;
}
function detectTimer(s){const m=String(s).match(/(\d+)(?:\s*[–-]\s*(\d+))?\s*minutes?/i);return m?Number(m[2]||m[1]):null}
function parseIngredient(raw,i=0){
  const text=String(raw).trim();
  const frac={"¼":.25,"½":.5,"¾":.75,"⅓":1/3,"⅔":2/3,"⅛":.125,"⅜":.375,"⅝":.625,"⅞":.875};
  let qty=null,unit="",name=text,prep="";

  const normalizeFraction=t=>{
    t=String(t).trim();
    if(frac[t]!=null)return frac[t];
    if(/^\d+\s+\d+\/\d+$/.test(t)){
      const [a,b]=t.split(/\s+/);const [n,d]=b.split("/").map(Number);return Number(a)+n/d;
    }
    if(/^\d+\/\d+$/.test(t)){const [n,d]=t.split("/").map(Number);return n/d}
    if(/^\d+(?:\.\d+)?$/.test(t))return Number(t);
    return null;
  };

  // Supports 1, 1.5, 1/2, 1 1/2, ½, etc.
  const q=text.match(/^(\d+\s+\d+\/\d+|\d+(?:\.\d+)?|\d+\/\d+|[¼½¾⅓⅔⅛⅜⅝⅞])\s*/);
  if(q){
    qty=normalizeFraction(q[1]);
    name=text.slice(q[0].length);

    // Common cooking units. Keep package-size text such as "(28-ounce) can" in the ingredient name.
    const um=name.match(/^(tablespoons?|tbsp|teaspoons?|tsp|cups?|fluid ounces?|fl oz|ounces?|oz|pounds?|lbs?|lb|grams?|g|kilograms?|kg|milliliters?|ml|liters?|l|cloves?|cans?|packages?|packets?|sticks?|slices?|pieces?|pinches?|pinch|dashes?|dash)\b\.?\s*/i);
    if(um){unit=um[1];name=name.slice(um[0].length)}
  }

  return {
    id:uid("ing"),
    rawText:text,
    quantity:qty,
    unit,
    name:name.trim(),
    preparation:prep,
    section:"",
    groceryCategory:guessGrocery(name),
    optional:/optional/i.test(text)
  };
}
function guessGrocery(name){
  const s=String(name).toLowerCase();
  if(/chicken|beef|pork|shrimp|fish|turkey/.test(s))return"Meat & Seafood";
  if(/milk|cheese|yogurt|butter|cream|egg/.test(s))return"Dairy & Eggs";
  if(/onion|garlic|lemon|lime|potato|tomato|cilantro|parsley|ginger|pepper/.test(s))return"Produce";
  if(/paprika|cumin|turmeric|coriander|salt|cinnamon|garam|oregano/.test(s))return"Spices & Seasonings";
  if(/soy sauce|vinegar|ketchup|mustard|pickle/.test(s))return"Sauces & Condiments";
  if(/flour|cornstarch|sugar|honey|rice|pasta|macaroni|breadcrumbs/.test(s))return"Pantry";
  return"Other";
}
function formatQty(n){
  if(n==null||Number.isNaN(Number(n)))return"";
  const v=Number(n), whole=Math.floor(v), f=v-whole;
  const map=[[.125,"⅛"],[.25,"¼"],[.333,"⅓"],[.375,"⅜"],[.5,"½"],[.625,"⅝"],[.667,"⅔"],[.75,"¾"],[.875,"⅞"]];
  let best=map.reduce((a,b)=>Math.abs(f-b[0])<Math.abs(f-a[0])?b:a,[0,""]);
  if(f<.04)return String(whole);
  if(Math.abs(f-best[0])<.04)return `${whole?whole+" ":""}${best[1]}`;
  return String(Math.round(v*100)/100);
}
function displayIngredient(i,m=1){
  if(i.quantity!=null && Number.isFinite(Number(i.quantity))){
    const scaled=Number(i.quantity)*Number(m||1);
    const q=formatQty(scaled);
    return [q,i.unit,i.name].filter(Boolean).join(" ").replace(/\s+/g," ").trim() + (i.preparation?`, ${i.preparation}`:"");
  }
  return i.rawText||i.name;
}

async function repairBuiltinServingMetadata(){
  const all=await idbAll("recipes");
  for(const r of all){
    const expected=expectedBuiltinServings(r.id);
    if(!expected)continue;

    // Only auto-repair built-in recipes that have not been user modified.
    // This avoids overwriting an intentional serving change made by the user.
    if(!r.userModified && Number(r.servings)!==expected){
      r.servings=expected;
      r.updatedAt=new Date().toISOString();
      await idbPut("recipes",r);
    }
  }
}

async function seedIfNeeded(){
  // 1) Migrate anything already saved by the original localStorage app.
  let existing=await idbAll("recipes");

  if(!existing.length){
    try{
      const old=JSON.parse(localStorage.getItem(OLD_STORAGE_KEY));
      if(Array.isArray(old)&&old.length){
        for(const raw of old){
          await idbPut("recipes",applyDefaultRecipePhoto(normalizeLegacy(raw,"user")));
        }
      }
    }catch{}
  }

  // 2) Always reconcile the original built-in recipe catalog.
  // Add a missing built-in recipe, but NEVER overwrite an existing/user-edited copy.
  const seeds=[
    starterRecipe,
    macCheeseRecipe,
    chickfilaSandwichRecipe,
    sweetPotatoWedgesRecipe,
    chickenShawarmaRecipe,
    groundChickenKebabRecipe,
    garlicPaprikaChickenRecipe,
    teriyakiChickenRecipe,
    butterChickenRecipe,
    tandooriChickenThighsRecipe,
    simpleTurkeyChiliRecipe,
    halalWhiteSauceRecipe
  ];

  existing=await idbAll("recipes");

  for(const seed of seeds){
    const alreadyThere=existing.some(r =>
      r.id===seed.id ||
      String(r.title||"").trim().toLowerCase()===String(seed.title||"").trim().toLowerCase()
    );

    if(!alreadyThere){
      const normalized=applyDefaultRecipePhoto(normalizeLegacy(seed,"builtin"));
      await idbPut("recipes",normalized);
      existing.push(normalized);
    }
  }

  await idbPut("meta",{key:"schemaVersion",value:SCHEMA_VERSION});
}

function changeServings(delta){
  const r=state.recipes.find(x=>x.id===state.currentId);if(!r)return;
  const base=Number(r.servings)||1;
  const current=Math.max(1,Math.round(base*state.servingMultiplier*100)/100);
  const next=Math.max(1,current+delta);
  state.servingMultiplier=next/base;
  renderDetail();
}
function setServings(value){

}

function photoDataSizeKB(dataUrl){
  if(!dataUrl)return 0;
  const comma=dataUrl.indexOf(",");
  const b64=comma>=0?dataUrl.slice(comma+1):dataUrl;
  return Math.round((b64.length*3/4)/1024);

async function loadImageFile(file){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{URL.revokeObjectURL(url);resolve(img)};
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("This image format could not be opened by the browser."))};
    img.src=url;
  });
}
async function compressRecipePhoto(file){
  if(!file||!String(file.type||"").startsWith("image/"))throw new Error("Please select an image file.");
  const maxInput=20*1024*1024;
  if(file.size>maxInput)throw new Error("That photo is larger than 20 MB. Please choose a smaller image.");

  const img=await loadImageFile(file);
  const maxSide=1400;
  let w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
  if(!w||!h)throw new Error("The image dimensions could not be read.");
  const scale=Math.min(1,maxSide/Math.max(w,h));
  w=Math.max(1,Math.round(w*scale));
  h=Math.max(1,Math.round(h*scale));

  const canvas=document.createElement("canvas");
  canvas.width=w;canvas.height=h;
  const ctx=canvas.getContext("2d",{alpha:false});
  ctx.fillStyle="#ffffff";ctx.fillRect(0,0,w,h);
  ctx.drawImage(img,0,0,w,h);

  // Start at good visual quality. If the result is still large, step quality down.
  let quality=.84;
  let data=canvas.toDataURL("image/jpeg",quality);
  while(photoDataSizeKB(data)>650 && quality>.62){
    quality-=.06;
    data=canvas.toDataURL("image/jpeg",quality);
  }
  return data;
}

}

function recursiveRecipe(x){

async function sendToGrocery(id){
 const r=state.recipes.find(x=>x.id===id);if(!r)return;const checked=[...groceryItems.querySelectorAll('input[type="checkbox"]:checked')].map(x=>x.dataset.id),m=state.servingMultiplier;
 const payload={transferVersion:1,transferId:uid("transfer"),createdAt:new Date().toISOString(),recipe:{recipeId:r.id,recipeName:r.title,servings:(r.servings||1)*m},items:(r.ingredients||[]).filter(i=>checked.includes(i.id)).map(i=>({ingredientId:i.id,name:i.name||i.rawText,quantity:i.quantity!=null?i.quantity*m:null,unit:i.unit||"",rawText:displayIngredient(i,m),groceryCategory:i.groceryCategory||"Other",optional:!!i.optional}))};
 let queue=[];try{queue=JSON.parse(localStorage.getItem(GROCERY_QUEUE_KEY))||[]}catch{};queue.push(payload);localStorage.setItem(GROCERY_QUEUE_KEY,JSON.stringify(queue));
 try{if(window.GroceryBridge&&typeof window.GroceryBridge.addItems==="function")await window.GroceryBridge.addItems(payload)}catch{}
 closeModal();toast(`${payload.items.length} ingredient${payload.items.length===1?"":"s"} queued for Grocery List`);
}

function renderCollections(){
 const map=new Map();for(const r of state.recipes){for(const c of r.collections||[]){if(!map.has(c))map.set(c,[]);map.get(c).push(r)}}
 els.content.innerHTML=`<div class="page-head"><div><h1>Collections</h1><p>Organize recipes into groups.</p></div></div>${map.size?[...map.entries()].map(([k,v])=>`<section class="section-card"><h2>${esc(k)} <span class="muted" style="font-weight:400">(${v.length})</span></h2><div class="recipe-grid">${v.map(cardHTML).join("")}</div></section>`).join(""):`<div class="empty"><div class="emoji">📚</div><h3>No collections yet</h3><p>Edit a recipe and add one or more collection names to organize it here.</p></div>`}`
}
function renderData(){
 els.content.innerHTML=`<div class="page-head"><div><h1>Backup & Data</h1><p>Keep a portable copy of your Recipe Box.</p></div></div>
 <div class="section-card"><h2>Master Backup</h2><p class="muted">Exports all recipes and collections as one JSON file.</p><button class="btn btn-primary" onclick="exportBackup()">Export Backup</button> <button class="btn btn-soft" onclick="document.getElementById('backupFile').click()">Import Backup</button><input id="backupFile" type="file" accept=".json,application/json" class="hidden" onchange="importBackup(this.files[0])"></div>
 <div class="section-card"><h2>Storage</h2><p><strong>${state.recipes.length}</strong> recipes stored in IndexedDB.</p><p class="muted">Schema version ${SCHEMA_VERSION} • App ${APP_VERSION}</p></div>
 <div class="section-card"><h2>Grocery Integration</h2><p class="muted">Selected ingredients are queued under the shared bridge key <code>${GROCERY_QUEUE_KEY}</code>. A future Grocery List app hosted under the same origin can read and clear this queue or implement <code>window.GroceryBridge.addItems()</code>.</p></div>`;
}
function exportBackup(){
 const data={schemaVersion:SCHEMA_VERSION,appVersion:APP_VERSION,exportedAt:new Date().toISOString(),recipes:state.recipes,collections:state.collections};
 const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`recipe_box_backup_${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)
}
async function importBackup(file){
 if(!file)return;try{
   const data=JSON.parse(await file.text()),arr=Array.isArray(data)?data:data.recipes;if(!Array.isArray(arr))throw new Error();
   const mode=prompt('Type MERGE to keep current recipes and add/update the backup, or REPLACE to erase current recipes first.','MERGE');
   if(!mode)return;
   const action=mode.trim().toUpperCase();
   if(action!=="MERGE"&&action!=="REPLACE"){alert("Import cancelled. Please choose MERGE or REPLACE.");return}
   if(action==="REPLACE"){
     if(!confirm("Replace ALL current Recipe Box data with this backup?"))return;
     await idbClear("recipes");await idbClear("collections");
   }
   for(const raw of arr){const r=normalizeLegacy(raw,raw.origin||"user");await idbPut("recipes",r)}
   if(Array.isArray(data.collections))for(const c of data.collections)await idbPut("collections",c);
   await reload();toast(action==="REPLACE"?"Backup restored successfully":"Backup merged successfully");
 }catch{alert("That file is not a valid Recipe Box backup.")}
}

let cookState={index:0};
function startCooking(){cookState.index=0;renderCook()}
function renderCook(){
 const r=state.recipes.find(x=>x.id===state.currentId),steps=r?.instructions||[];if(!steps.length){alert("This recipe has no instructions.");return}
 const i=Math.max(0,Math.min(cookState.index,steps.length-1)),s=steps[i];
 const root=document.createElement("div");root.id="cookMode";root.className="cook";root.innerHTML=`<div class="cook-top"><strong>${esc(r.title)}</strong><button class="btn btn-ghost" onclick="document.getElementById('cookMode').remove()">Exit</button></div><div class="cook-main"><div><div class="cook-progress" style="text-align:center;margin-bottom:18px">Step ${i+1} of ${steps.length}</div><div class="cook-step">${esc(s.text||s)}</div>${s.timerMinutes?`<div style="text-align:center;margin-top:22px"><button class="btn btn-soft" onclick="startTimer(${Number(s.timerMinutes)})">⏱ Start ${Number(s.timerMinutes)}-minute timer</button></div>`:""}</div></div><div class="cook-foot"><button class="btn btn-ghost" onclick="cookPrev()" ${i===0?"disabled":""}>← Back</button><button class="btn btn-primary" onclick="${i===steps.length-1?"finishCooking()":"cookNext()"}">${i===steps.length-1?"Finish":"Next →"}</button></div>`;
 document.body.appendChild(root)
}
function cookPrev(){cookState.index--;document.getElementById("cookMode")?.remove();renderCook()}
function cookNext(){cookState.index++;document.getElementById("cookMode")?.remove();renderCook()}
async function finishCooking(){const r=state.recipes.find(x=>x.id===state.currentId);if(r){r.lastCooked=new Date().toISOString();r.timesCooked=(r.timesCooked||0)+1;await idbPut("recipes",r)}document.getElementById("cookMode")?.remove();await reload();toast("Marked as cooked")}
function startTimer(min){const ms=min*60000,ends=Date.now()+ms;toast(`${min}-minute timer started`);setTimeout(()=>{alert(`Timer finished: ${min} minute${min===1?"":"s"}.`)},ms)}

function modal(inner){els.modalRoot.innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal">${inner}</div></div>`}
function closeModal(){els.modalRoot.innerHTML=""}
function toast(msg){els.toastRoot.innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>els.toastRoot.innerHTML="",2600)}
function openSidebar(v=true){
  const open=!!v;
  els.sidebar.classList.toggle("open",open);
  const bd=els.sidebarBackdrop;
  if(bd)bd.classList.toggle("show",open);
  if(window.innerWidth<=760)document.body.style.overflow=open?"hidden":"";
}

document.querySelectorAll(".nav button[data-page]").forEach(b=>b.addEventListener("click",()=>{state.page=b.dataset.page;state.currentId=null;openSidebar(false);render()}));
els.globalSearch.addEventListener("input",e=>{state.search=e.target.value;state.currentId=null;if(state.page==="data"||state.page==="collections")state.page="recipes";render()});
els.menuBtn.addEventListener("click",()=>openSidebar(!els.sidebar.classList.contains("open")));
window.addEventListener("resize",()=>{
  if(window.innerWidth>760){
    els.sidebar.classList.remove("open");
    els.sidebarBackdrop?.classList.remove("show");
    document.body.style.overflow="";
  }
});
els.addBtn.onclick=els.navAdd.onclick=openAddChoice;

(async function init(){
  try{
    if(!els.content)throw new Error("Main content container was not found.");
    db=await openDB();
    await seedIfNeeded();
    await seedExistingRecipeWebPhotos();
    await repairBuiltinServingMetadata();
    state.recipes=await idbAll("recipes");
    state.collections=await idbAll("collections");
    render();
  }catch(e){
    console.error("Recipe Box startup error:",e);
    const target=els.content||document.getElementById("content")||document.body;
    target.innerHTML=`<div class="empty"><div class="emoji">⚠️</div><h3>Recipe Box could not start.</h3><p>${esc(e?.message||String(e))}</p><p class="muted">Try refreshing once. Your saved recipe data has not been intentionally cleared.</p></div>`;
  }
})();
</script>
